<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Shop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    /* ---- Header ---- */
    header {
      background: #2c3e50;
      color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 22px; }

    .cart-btn {
      background: #e67e22;
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .cart-btn:hover { background: #d35400; }

    /* ---- Products ---- */
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .product:hover { transform: translateY(-4px); }

    .product img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product h3 {
      font-size: 17px;
      margin: 12px 0 6px;
    }

    .price {
      color: #e67e22;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .add-btn {
      background: #2c3e50;
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }

    .add-btn:hover { background: #1a252f; }

    /* ---- Cart Panel ---- */
    .cart-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: #fff;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      padding: 20px;
      transition: right 0.3s;
      overflow-y: auto;
    }

    .cart-panel.open { right: 0; }

    .cart-panel h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .total {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>🛍️ Simple Shop</h1>
    <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <!-- Product List -->
  <div class="container">
    <div class="products" id="product-list"></div>
  </div>

  <!-- Cart Side Panel -->
  <div class="cart-panel" id="cart-panel">
    <button class="close-btn" onclick="toggleCart()">✖</button>
    <h2>Your Cart</h2>
    <div id="cart-items"><p>Cart is empty.</p></div>
    <div class="total" id="cart-total"></div>
  </div>

  <script>
    // Product data
    const products = [
      { id: 1, name: "Wireless Headphones", price: 59.99, img: "https://picsum.photos/seed/head/300/200" },
      { id: 2, name: "Smart Watch",         price: 89.99, img: "https://picsum.photos/seed/watch/300/200" },
      { id: 3, name: "Backpack",            price: 39.50, img: "https://picsum.photos/seed/bag/300/200" },
      { id: 4, name: "Sneakers",            price: 74.00, img: "https://picsum.photos/seed/shoe/300/200" },
      { id: 5, name: "Sunglasses",          price: 24.99, img: "https://picsum.photos/seed/glass/300/200" },
      { id: 6, name: "Coffee Mug",          price: 12.00, img: "https://picsum.photos/seed/mug/300/200" }
    ];

    let cart = [];

    // Render products
    const list = document.getElementById("product-list");
    products.forEach(p => {
      list.innerHTML += `
        <div class="product">
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">$${p.price.toFixed(2)}</p>
          <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>`;
    });

    // Add item to cart
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    // Render cart contents
    function renderCart() {
      const itemsBox = document.getElementById("cart-items");
      const totalBox = document.getElementById("cart-total");
      const countBox = document.getElementById("cart-count");

      if (cart.length === 0) {
        itemsBox.innerHTML = "<p>Cart is empty.</p>";
        totalBox.textContent = "";
        countBox.textContent = 0;
        return;
      }

      let html = "";
      let total = 0;
      let count = 0;

      cart.forEach(item => {
        total += item.price * item.qty;
        count += item.qty;
        html += `
          <div class="cart-item">
            <span>${item.name} × ${item.qty}</span>
            <span>$${(item.price * item.qty).toFixed(2)}</span>
          </div>`;
      });

      itemsBox.innerHTML = html;
      totalBox.textContent = "Total: $" + total.toFixed(2);
      countBox.textContent = count;
    }

    // Toggle cart panel
    function toggleCart() {
      document.getElementById("cart-panel").classList.toggle("open");
    }
  </script>

</body>
</html>
